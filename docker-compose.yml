services:
  dotnet:
    build:
      context: .
    working_dir: /app
    # Optional argument fallbacks for the examples; unset host vars stay unset.
    environment:
      - OMNETIC_SA_KEY_PATH
      - OMNETIC_SA_KID
      - OMNETIC_DMS_API_URL
    volumes:
      - .:/app:Z
      - nuget-cache:/root/.nuget/packages

volumes:
  nuget-cache:
